name: PPPlayer Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Validate Version & Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Formatting
        run: dart format --output=none .

      - name: Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Validate Version Matching
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG_NAME#v}"
          
          # Remove suffix (e.g. -test, -rc1) to get base version string
          BASE_VERSION=$(echo "$TAG_VERSION" | cut -d'-' -f1)
          
          # Extract pubspec.yaml version (format: 1.0.4+5)
          PUBSPEC_VERSION_FULL=$(grep '^version: ' pubspec.yaml | cut -d' ' -f2 | tr -d '\r')
          PUBSPEC_BASE_VERSION=$(echo "$PUBSPEC_VERSION_FULL" | cut -d'+' -f1)
          PUBSPEC_BUILD_NUMBER=$(echo "$PUBSPEC_VERSION_FULL" | cut -d'+' -f2)
          
          if [ "$BASE_VERSION" != "$PUBSPEC_BASE_VERSION" ]; then
             echo "::error::Tag version ($BASE_VERSION) does not match pubspec.yaml version ($PUBSPEC_BASE_VERSION)!"
             exit 1
          fi
          
          # Fetch highest build number from old ppplayer repo to ensure strict incrementation
          echo "Fetching releases from old ppplayer repository..."
          # Since it's public now, gh can read it without auth, but we pass GITHUB_TOKEN just in case
          PREV_TAG=$(gh release list --repo ppplayermusic/ppplayer --exclude-drafts --limit 1 | awk '{print $1}' || echo "")
          
          if [ -n "$PREV_TAG" ]; then
             # Try to parse build number from old release if we can, or just warn
             echo "Highest previous release in root repo was $PREV_TAG. Please ensure versionCode $PUBSPEC_BUILD_NUMBER is strictly greater than the one in $PREV_TAG."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android App
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
             echo "::error::Android signing secrets are missing. Strict signing requires ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
             exit 1
          fi
          
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          
          cat << EOF > android/key.properties
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: Build Release APK
        run: flutter build apk --release

      - name: Setup Android SDK Build-Tools for apksigner
        uses: android-actions/setup-android@v3

      - name: Verify APK Signature
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | tail -1)
          $BUILD_TOOLS_DIR/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PPPlayer-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    name: Build macOS App
    needs: validate-and-test
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          mkdir -p build/ios/SourcePackages/
          flutter pub get

      - name: Import macOS Certificate
        env:
          MACOS_CERTIFICATE_B64: ${{ secrets.MACOS_CERTIFICATE_B64 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_B64" ] || [ -z "$MACOS_CERTIFICATE_PWD" ]; then
             echo "::error::macOS signing certificate secrets are missing. Strict signing requires MACOS_CERTIFICATE_B64 and MACOS_CERTIFICATE_PWD."
             exit 1
          fi
          
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$MACOS_CERTIFICATE_B64" | base64 --decode -o $CERT_PATH
          
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH

          security import $CERT_PATH -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          
          # Set as default to ensure codesign picks it up
          security list-keychains -d user -s $KEYCHAIN_PATH

      - name: Configure Xcode for Distribution Signing
        run: |
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "Developer ID Application";/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "Apple Development";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "Developer ID Application";/g' macos/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' macos/Runner.xcodeproj/project.pbxproj

      - name: Build Release macOS
        run: flutter build macos --release

      - name: Verify Advertised Architectures
        working-directory: build/macos/Build/Products/Release
        run: |
          # Verify architectures (expecting arm64 and x86_64, or just one based on build settings)
          lipo -info PPPlayer.app/Contents/MacOS/PPPlayer
          codesign -dv --verbose=4 PPPlayer.app

      - name: Package App (ZIP)
        working-directory: build/macos/Build/Products/Release
        run: |
          # Zip preserving bundle permissions and symlinks
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent PPPlayer.app PPPlayer-macOS.zip

      - name: Upload macOS Zip
        uses: actions/upload-artifact@v4
        with:
          name: PPPlayer-macOS-zip
          path: build/macos/Build/Products/Release/PPPlayer-macOS.zip

      - name: Package DMG & Notarize
        working-directory: build/macos/Build/Products/Release
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APP_SPECIFIC_PASSWORD" ] || [ -z "$TEAM_ID" ]; then
             echo "::error::Notarization secrets missing. Strict signing requires APPLE_ID, APP_SPECIFIC_PASSWORD, and TEAM_ID."
             exit 1
          fi
          
          # Create DMG
          npm install -g create-dmg
          create-dmg PPPlayer.app || true # Fallback if create-dmg fails on CI runner due to styling issues
          mv *.dmg PPPlayer-macOS.dmg || { echo "DMG creation failed"; exit 1; }
          
          echo "Submitting DMG for notarization..."
          xcrun notarytool submit PPPlayer-macOS.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait
            
          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple PPPlayer-macOS.dmg
          
          echo "Verifying DMG notarization..."
          spctl -a -t open --context context:primary-signature PPPlayer-macOS.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: PPPlayer-macOS-dmg
          path: build/macos/Build/Products/Release/PPPlayer-macOS.dmg

  # TODO: Build Windows App (build-windows)
  # TODO: Build Linux App (build-linux)

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-macos]
    # IMPORTANT: Ensure this ONLY runs on actual tag pushes, not workflow_dispatch manual runs!
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Scope: only the publish job has write access to create the release
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Check Artifacts Existence
        run: |
          ls -R artifacts/
          
          # Require every expected asset to exist
          if [ ! -f "artifacts/PPPlayer-Android/app-release.apk" ]; then
             echo "::error::Android APK artifact is missing!"
             exit 1
          fi
          
          if [ ! -f "artifacts/PPPlayer-macOS-zip/PPPlayer-macOS.zip" ]; then
             echo "::error::macOS ZIP artifact is missing!"
             exit 1
          fi
          
          if [ ! -f "artifacts/PPPlayer-macOS-dmg/PPPlayer-macOS.dmg" ]; then
             echo "::error::macOS DMG artifact is missing!"
             exit 1
          fi

      - name: Prepare Assets & Checksums
        run: |
          mkdir -p release-assets
          cp artifacts/PPPlayer-Android/app-release.apk release-assets/PPPlayer-Android.apk
          cp artifacts/PPPlayer-macOS-zip/PPPlayer-macOS.zip release-assets/PPPlayer-macOS.zip
          cp artifacts/PPPlayer-macOS-dmg/PPPlayer-macOS.dmg release-assets/PPPlayer-macOS.dmg
          
          cd release-assets
          shasum -a 256 * > checksums.txt
          cat checksums.txt

      - name: Extract Release Notes from CHANGELOG.md
        id: extract_notes
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG_NAME#v}"
          
          # Remove suffix (e.g. -test) for changelog extraction
          BASE_VERSION=$(echo "$TAG_VERSION" | cut -d'-' -f1)
          
          # Extract the section for this version
          awk -v ver="\\[$BASE_VERSION\\]" '
            $0 ~ "^## " ver { found=1; next }
            /^## \[/ && found { exit }
            found { print }
          ' CHANGELOG.md > extracted_notes.md
          
          cat extracted_notes.md

      - name: Determine Prerelease Flag
        id: prerelease_check
        run: |
          # If the tag contains a hyphen (e.g., v1.0.4-test), mark as prerelease
          if [[ "${GITHUB_REF_NAME}" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "make_latest=false" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "make_latest=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: extracted_notes.md
          prerelease: ${{ steps.prerelease_check.outputs.is_prerelease }}
          make_latest: ${{ steps.prerelease_check.outputs.make_latest }}
          generate_release_notes: true
          files: |
            release-assets/*
