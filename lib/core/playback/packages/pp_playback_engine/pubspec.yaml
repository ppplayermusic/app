name: pp_playback_engine
description: "A robust, multi-resolver YouTube playback engine for ppplayer."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  youtube_explode_dart: ^3.0.5
  dio: ^5.9.2
  meta: ^1.11.0
  youtube_player_iframe: ^5.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

dependency_overrides:
  youtube_player_iframe:
    path: ../../youtube_player_iframe_macos_patch/package
