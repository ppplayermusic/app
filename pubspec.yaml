name: ppplayer
description: "Music player powered by Spotify + YouTube."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  audio_service: ^0.18.18
  audio_session: ^0.2.3
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.0.0
  dio: ^5.9.2
  drift: ^2.22.0
  drift_flutter: ^0.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_dotenv: ^6.0.0
  flutter_driver:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  freezed_annotation: ^2.4.4
  go_router: ^13.2.5
  google_mobile_ads: ^7.0.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  in_app_purchase: ^3.2.3
  json_annotation: ^4.9.0
  path_provider: ^2.1.5
  riverpod_annotation: ^2.3.5
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1
  webview_flutter_wkwebview: ^3.24.2
  youtube_player_flutter: ^9.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.0
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.9.3
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21 # android min sdk

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/

