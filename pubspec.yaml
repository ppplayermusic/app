name: ppplayer
description: "Music player powered by Lucas Veneno."
publish_to: 'none'
version: 1.3.3+1

environment:
  sdk: ^3.7.0

dependencies:
  audio_service: ^0.18.18
  audio_session: ^0.2.3
  cached_network_image: ^4.0.0
  flutter_cache_manager: ^3.4.1
  connectivity_plus: 6.1.5
  dio: ^5.9.2
  drift: ^2.22.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_animate: ^4.5.2
  flutter_dotenv: ^6.0.0
  flutter_driver:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  google_mobile_ads: ^9.1.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  json_annotation: ^4.9.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  crypto: ^3.0.6
  file_picker: ^12.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  permission_handler: ^13.0.2
  riverpod_annotation: ^4.0.7
  url_launcher: ^6.3.2
  youtube_explode_dart: ^3.0.5
  youtube_explode_dart_plus: ^1.0.3

  pp_playback_engine:
    path: lib/core/playback/packages/pp_playback_engine
  youtube_player_iframe:
    path: lib/core/playback/packages/youtube_player_iframe_macos_patch/package
  flutter_secure_storage: ^11.0.0
  package_info_plus: ^10.2.1
  uuid: ^4.6.0
  path: ^1.9.1
  metadata_god: ^1.1.0
  macos_file_open_handler: ^0.1.0
  webview_win_floating: ^3.0.3
  windows_taskbar: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.22.0
  riverpod_generator: ^4.0.9
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.9.3
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.7
  mocktail: ^1.0.4
  mockito: ^5.7.0
  msix: ^3.18.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  macos:
    generate: true
    image_path: "assets/logo.png"
  windows:
    generate: true
    image_path: "assets/logo.png"
  image_path: "assets/logo.png"
  min_sdk_android: 21 # android min sdk

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/images/mix_covers/
    - assets/LICENSE

flutter_native_splash:
  color: "#0A0A0A"
  color_dark: "#0A0A0A"
  image: "assets/logo.png"
  image_dark: "assets/logo.png"
  android: true
  ios: true

dependency_overrides:
  # Local patch of youtube_player_iframe that adds macOS to the JS bridge
  # switch statement in player.html. Without this, onReady/onStateChange never
  # fire on macOS because 'macos' was missing from sendPlatformMessage().
  youtube_player_iframe:
    path: lib/core/playback/packages/youtube_player_iframe_macos_patch/package
  freezed_annotation: ^3.1.0
  flutter_rust_bridge: 2.11.1

msix_config:
  display_name: PPPlayer
  publisher_display_name: Lucas Veneno
  identity_name: LucasVeneno.25880C6F60D2E
  publisher: CN=191B0E6A-B98A-4AB5-B2FC-9EBDA47DA56E
  msix_version: 1.3.3.0
  logo_path: assets/logo.png
  architecture: x64
  capabilities: internetClient, musicLibrary
  store: true
